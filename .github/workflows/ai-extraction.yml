name: AI extraction verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [quality, extraction, services]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # The migration regression test compares the migration files against
          # the integration base commit, so the full history must be present.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Runner capacity
        run: |
          free -m
          df -h .
      - run: npm ci
      - name: quality gates
        if: matrix.shard == 'quality'
        run: |
          set -euo pipefail
          npm run build
          npm run typecheck
          npm run lint
      - name: extraction gates
        if: matrix.shard == 'extraction'
        run: |
          set -euo pipefail
          npm run test:extraction
          npm run test:config
          npm run test:forms
      - name: services gates
        if: matrix.shard == 'services'
        run: |
          set -euo pipefail
          npm run test:operations
          npm run test:email
          npm run test:whatsapp-pairing
          npm run test:whatsapp
          npm run test:workspace
          npm run test:smtp
          npm run test:runtime
          npm run verify:api:local
  node-gates:
    runs-on: ubuntu-24.04
    needs: [node-shards]
    if: always()
    steps:
      - name: Require every Node shard
        env:
          SHARDS_RESULT: ${{ needs.node-shards.result }}
        run: test "$SHARDS_RESULT" = success
  browser-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        browser: [chromium, firefox]
    env:
      BROWSER_ENGINE: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # The same baseline as the node gates, so every job sees one history.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Runner capacity
        run: |
          free -m
          df -h .
      - run: npm ci
      - run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - run: node scripts/verify-extraction-browser.mjs
      - run: node scripts/verify-extraction-browser.mjs --built
      - if: matrix.browser == 'chromium'
        run: node scripts/verify-document-layout.mjs
